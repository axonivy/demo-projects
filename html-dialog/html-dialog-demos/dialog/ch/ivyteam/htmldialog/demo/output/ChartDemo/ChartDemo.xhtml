<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions">
<h:body>
  <ui:composition template="/layouts/HtmlDemo.xhtml">
    <ui:param name="centerHeader" value="Charts Demo" />

    <ui:define name="content">
      <h:form id="form">
        <p:growl id="growl" showDetail="true" />
        <br />
        <p:chart value="#{data.comboChartModel.toJson()}" style="width:450px;height:300px;" id="comboChart">

          <p:ajax event="itemSelect" update="growl" listener="#{logic.itemSelected}" />
        </p:chart>
        <br />
        <br />
        <p:chart value="#{data.pieChartModel.toJson()}" style="width:450px;height:300px" id="pieChart">

          <p:ajax event="itemSelect" update="growl" listener="#{logic.sliceSelected}" />
        </p:chart>
      </h:form>

    </ui:define>

  </ui:composition>
</h:body>

</html>
